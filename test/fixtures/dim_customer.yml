version: 2

models:
  - name: DIM_CUSTOMER
    description: "One row per customer."
    config:
      meta:
        table_type: dimension
        status: planned
        grain: one row per customer
        sources:
          - name: customers
            description: Customer master
            table: SHOP.RAW.CUSTOMERS
            filter: all
            watermark: UPDATED_AT
        review:
          verified_date: "2026-11-01"
          verified_by: Josh
          verified_against: source tables
          notes: Draft.
    constraints:
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [CUSTOMER_KEY]
          config:
            where: "IS_CURRENT = true"
    columns:
      - name: CUSTOMER_KEY
        data_type: NUMBER
        description: "Surrogate key"
        meta:
          codes: [CK]
          display_name: Customer Key
          default_value: "-1"
          source: generated
          transform: hash of CUSTOMER_ID
